<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#7ec8f0" />
    <meta name="description" content="卡通 3D 宠物 · 点一下换动作" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="3D Pet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>3D Pet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <button id="fullness" class="fullness" type="button" hidden>
        <span id="fullnessMark" class="fullness-mark">鹿</span>
        <div>
          <p class="fullness-label">饱腹度</p>
          <strong id="fullnessValue">100</strong>
        </div>
      </button>

      <p id="status" class="status" hidden>加载中…</p>

      <button id="feedBtn" class="feed-btn" type="button" hidden aria-label="喂食">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="26" fill="#e2a15a" />
          <circle cx="22" cy="26" r="3.2" fill="#8a5a32" />
          <circle cx="40" cy="22" r="2.6" fill="#8a5a32" />
          <circle cx="36" cy="40" r="3" fill="#8a5a32" />
          <circle cx="23" cy="40" r="2.2" fill="#8a5a32" />
          <circle cx="46" cy="33" r="2.4" fill="#8a5a32" />
        </svg>
      </button>
      <div id="joystick" class="joystick" aria-label="遥感移动">
        <div class="joystick-base">
          <div id="joystickKnob" class="joystick-knob"></div>
        </div>
      </div>
      <p id="feedGain" class="feed-gain" hidden>+10</p>

      <aside id="settings" class="settings" hidden>
        <div class="settings-panel">
          <div class="settings-head">
            <h2>选择宠物</h2>
            <button id="closeSettings" class="icon-btn" type="button">关闭</button>
          </div>
          <p class="settings-note">
            资源来自 <a href="https://poly.pizza" target="_blank" rel="noreferrer">poly.pizza</a>
            （Quaternius，CC0）。会记住上次宠物、视角，以及每只动物的饱腹度。加载失败时点一下画面即可重试。
          </p>
          <p class="settings-note install-tip">
            <strong>加到 iPhone 桌面：</strong>Safari 打开本页 → 点底部分享 →「添加到主屏幕」。
          </p>
          <button id="resetViewBtn" class="reset-view-btn" type="button">恢复默认视角</button>
          <button id="openEditorBtn" class="reset-view-btn" type="button">场景编辑器</button>
          <button id="importSceneBtn" class="reset-view-btn" type="button">导入场景到当前世界</button>
          <button id="clearSceneBtn" class="reset-view-btn" type="button">恢复默认场景</button>
          <input id="sceneFile" type="file" accept="application/json,.json" hidden />
          <div id="petList" class="pet-list"></div>
          <p class="credit">
            Models by
            <a href="https://quaternius.com" target="_blank" rel="noreferrer">Quaternius</a>
            via poly.pizza · CC0
          </p>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
